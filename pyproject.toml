[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "exchange-trading-days"
version = "0.1.1"
description = "Trading days, holidays and early closes for NYSE, LSE, TSX, Xetra, Euronext, Tokyo, HKEX, ASX and SIX (2026-2028). Standard library only."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Plainfold", email = "plainfoldhq@proton.me" }]
keywords = ["stock exchange", "trading days", "market holidays", "early close", "nyse", "lse", "tokyo stock exchange", "business days", "trading calendar"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Homepage = "https://github.com/plainfoldhq/stock-exchange-holidays"
Documentation = "https://plainfoldhq.github.io/stock-market-holidays/"
Source = "https://github.com/plainfoldhq/stock-exchange-holidays"
Issues = "https://github.com/plainfoldhq/stock-exchange-holidays/issues"

[project.scripts]
exchange-trading-days = "exchange_trading_days:cli"

[tool.setuptools.package-data]
exchange_trading_days = ["data/*.csv"]
